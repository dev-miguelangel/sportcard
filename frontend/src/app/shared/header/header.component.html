<header class="border-b border-neutral-800 bg-neutral-900/80 backdrop-blur-sm sticky top-0 z-10"
        style="padding-top: env(safe-area-inset-top)">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-3">

    <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center flex-shrink-0">
      <svg viewBox="0 -960 960 960" class="w-5 h-5" fill="#0a0a0f">
        <path d="M440-200q-100 0-170-70t-70-170q0-11 1-22t3-22q-5 2-12 3t-12 1q-42 0-71-29t-29-71q0-42 27.5-71t69.5-29q33 0 59.5 18.5T274-614q33-30 75.5-48t90.5-18h440v160H680v80q0 100-70 170t-170 70ZM208.5-551.5Q220-563 220-580t-11.5-28.5Q197-620 180-620t-28.5 11.5Q140-597 140-580t11.5 28.5Q163-540 180-540t28.5-11.5ZM539-341q41-41 41-99t-41-99q-41-41-99-41t-99 41q-41 41-41 99t41 99q41 41 99 41t99-41Zm-42.5-42.5Q520-407 520-440t-23.5-56.5Q473-520 440-520t-56.5 23.5Q360-473 360-440t23.5 56.5Q407-360 440-360t56.5-23.5ZM440-440Z"/>
      </svg>
    </div>
    <span class="font-bold text-sm">Sport Card</span>

    <div class="ml-auto flex items-center gap-2">
      <button
        (click)="navigateTo('/notifications')"
        class="relative p-2 rounded-lg hover:bg-neutral-800 transition-colors min-w-[44px] min-h-[44px] flex items-center justify-center">
        <span [class]="'material-symbols-outlined ' + (unreadCount() > 0 ? 'text-white' : 'text-neutral-400')"
              style="font-size:20px">notifications</span>
        @if (unreadCount() > 0) {
          <span class="absolute top-1.5 right-1.5 min-w-[16px] h-4 rounded-full bg-red-500 flex items-center justify-center px-1">
            <span class="text-[10px] font-black text-white leading-none">{{ unreadCount() > 9 ? '9+' : unreadCount() }}</span>
          </span>
        } @else if (pwa.hasInstallNotification()) {
          <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-red-500"></span>
        }
      </button>

      @if (auth.currentUser(); as user) {
        <button
          (click)="navigateTo('/profile')"
          class="flex items-center gap-2 rounded-lg px-2 py-1 hover:bg-neutral-800 transition-colors min-h-[44px]"
        >
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand to-emerald-600 flex items-center justify-center text-xs font-black text-neutral-950 flex-shrink-0">
            {{ user.name.charAt(0).toUpperCase() }}
          </div>
          <span class="hidden sm:block text-sm font-medium text-neutral-300">{{ user.name }}</span>
        </button>
      }
    </div>

  </div>
</header>
