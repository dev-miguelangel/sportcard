<div class="min-h-screen bg-neutral-950 flex flex-col">

  <app-header />

  <!-- Content -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 pb-[calc(5rem+env(safe-area-inset-bottom))]">

    @if (auth.currentUser(); as user) {
      <div class="mb-6">
        <p class="text-sm text-neutral-500 mb-0.5">Bienvenido de vuelta</p>
        <h1 class="text-2xl font-black tracking-tight">Hola, {{ user.name }} 👋</h1>
      </div>
    }

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4">
        <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">Eventos</p>
        <p class="text-2xl font-black text-brand">0</p>
        <p class="text-[10px] text-neutral-600 mt-1">este mes</p>
      </div>
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4">
        <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">Racha</p>
        <p class="text-2xl font-black text-orange-400">0 🔥</p>
        <p class="text-[10px] text-neutral-600 mt-1">días activos</p>
      </div>
      <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4">
        <p class="text-[10px] text-neutral-500 uppercase tracking-wider mb-1">Victorias</p>
        <p class="text-2xl font-black text-blue-400">0</p>
        <p class="text-[10px] text-neutral-600 mt-1">registradas</p>
      </div>
    </div>

    <!-- Empty state -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-10 text-center">
      <span class="material-symbols-outlined text-neutral-600 mb-4 block" style="font-size:48px">sports</span>
      <h2 class="font-bold text-neutral-300 mb-2">¡Todo listo para empezar!</h2>
      <p class="text-sm text-neutral-500 mb-6 max-w-xs mx-auto">
        Crea tu primer evento deportivo o únete a uno existente.
      </p>
      <button class="bg-brand text-neutral-950 font-bold px-5 py-3 rounded-xl hover:bg-brand-dark transition-colors flex items-center gap-2 mx-auto min-h-[44px]">
        <span class="material-symbols-outlined" style="font-size:18px">add</span>
        Crear evento
      </button>
    </div>

  </main>

  <app-bottom-nav activeTab="home" />

</div>
