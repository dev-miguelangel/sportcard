<div class="flex h-screen overflow-hidden bg-neutral-950">

  <!-- Sidebar desktop -->
  <div class="hidden md:flex flex-shrink-0 h-full">
    <app-sidebar [collapsed]="sidebarCollapsed()" (toggle)="toggleSidebar()" />
  </div>

  <!-- Mobile sidebar overlay -->
  @if (mobileSidebarOpen()) {
    <div class="fixed inset-0 z-40 flex md:hidden">
      <div class="absolute inset-0 bg-black/60" (click)="toggleMobile()"></div>
      <div class="relative z-50 flex h-full">
        <app-sidebar [collapsed]="false" (toggle)="toggleMobile()" />
      </div>
    </div>
  }

  <!-- Main content -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Mobile header -->
    <header class="md:hidden flex items-center h-14 px-4 border-b border-neutral-800 bg-neutral-900 flex-shrink-0">
      <button (click)="toggleMobile()"
              class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-neutral-800 transition-colors mr-3">
        <span class="material-symbols-outlined text-neutral-400" style="font-size:22px">menu</span>
      </button>
      <span class="font-bold text-sm">RocketId · Torneos</span>
    </header>

    <!-- Page content -->
    <main class="flex-1 overflow-y-auto">
      <router-outlet />
    </main>

  </div>
</div>
