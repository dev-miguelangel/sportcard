<div class="p-6 max-w-xl mx-auto">

  <div class="flex items-center gap-3 mb-6">
    <button (click)="goBack()"
            class="w-9 h-9 flex items-center justify-center rounded-xl bg-neutral-900 border border-neutral-800 hover:bg-neutral-800 transition-colors">
      <span class="material-symbols-outlined text-neutral-400" style="font-size:20px">arrow_back</span>
    </button>
    <h1 class="text-xl font-black">Nuevo torneo</h1>
  </div>

  <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6">

    @if (error()) {
      <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 mb-5">
        <span class="material-symbols-outlined text-red-400" style="font-size:18px">error</span>
        <span class="text-sm text-red-400">{{ error() }}</span>
      </div>
    }

    <div class="flex flex-col gap-5">

      <!-- Nombre -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">Nombre *</label>
        <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)"
               placeholder="Ej: Copa Primavera 2026"
               class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                      focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
      </div>

      <!-- Deporte -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">Deporte *</label>
        <select [ngModel]="sport()" (ngModelChange)="sport.set($event)"
                class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white
                       focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]">
          @for (s of sports; track s.value) {
            <option [value]="s.value">{{ s.label }}</option>
          }
        </select>
      </div>

      <!-- Formato -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">Formato *</label>
        <div class="grid grid-cols-2 gap-2">
          @for (f of formats; track f.value) {
            <button type="button" (click)="format.set(f.value)"
                    [class]="format() === f.value
                      ? 'border-brand bg-brand/10 text-white'
                      : 'border-neutral-700 bg-neutral-800 text-neutral-400 hover:border-neutral-600'"
                    class="flex flex-col items-start p-3 border rounded-xl transition-colors text-left">
              <p class="text-sm font-bold">{{ f.label }}</p>
              <p class="text-[10px] text-neutral-500 mt-0.5">{{ f.description }}</p>
            </button>
          }
        </div>
      </div>

      <!-- Max equipos -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">Máximo de equipos <span class="text-neutral-600">(opcional)</span></label>
        <input type="number" [ngModel]="maxTeams()" (ngModelChange)="maxTeams.set($event)"
               placeholder="Sin límite" min="2"
               class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                      focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
      </div>

      <!-- Fechas -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-neutral-400">Inicio <span class="text-neutral-600">(opcional)</span></label>
          <input type="date" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)"
                 class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white
                        focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-neutral-400">Fin <span class="text-neutral-600">(opcional)</span></label>
          <input type="date" [ngModel]="endDate()" (ngModelChange)="endDate.set($event)"
                 class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white
                        focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
        </div>
      </div>

      <!-- Categoría -->
      <div class="flex flex-col gap-3">
        <p class="text-xs font-semibold text-neutral-400">Categoría <span class="text-neutral-600">(opcional)</span></p>
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-500">Edad mínima</label>
            <input type="number" [ngModel]="minAge()" (ngModelChange)="minAge.set($event)"
                   placeholder="Sin límite" min="0"
                   class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                          focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-500">Edad máxima</label>
            <input type="number" [ngModel]="maxAge()" (ngModelChange)="maxAge.set($event)"
                   placeholder="Sin límite" min="0"
                   class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                          focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
          </div>
        </div>
      </div>

      <!-- Toggles -->
      <div class="flex flex-col gap-3">
        <label class="flex items-center justify-between cursor-pointer">
          <div>
            <p class="text-sm font-semibold text-white">Inscripción abierta</p>
            <p class="text-xs text-neutral-500 mt-0.5">Los equipos pueden inscribirse</p>
          </div>
          <button type="button" (click)="registrationOpen.set(!registrationOpen())"
                  [class]="registrationOpen() ? 'bg-brand' : 'bg-neutral-700'"
                  class="relative w-11 h-6 rounded-full transition-colors flex-shrink-0">
            <span [class]="registrationOpen() ? 'translate-x-5' : 'translate-x-0.5'"
                  class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform"></span>
          </button>
        </label>

        <label class="flex items-center justify-between cursor-pointer">
          <div>
            <p class="text-sm font-semibold text-white">Requiere aprobación</p>
            <p class="text-xs text-neutral-500 mt-0.5">Aprueba cada inscripción manualmente</p>
          </div>
          <button type="button" (click)="requiresApproval.set(!requiresApproval())"
                  [class]="requiresApproval() ? 'bg-brand' : 'bg-neutral-700'"
                  class="relative w-11 h-6 rounded-full transition-colors flex-shrink-0">
            <span [class]="requiresApproval() ? 'translate-x-5' : 'translate-x-0.5'"
                  class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform"></span>
          </button>
        </label>

        <label class="flex items-center justify-between cursor-pointer">
          <div>
            <p class="text-sm font-semibold text-white">Inscripciones individuales</p>
            <p class="text-xs text-neutral-500 mt-0.5">Sin necesidad de equipo</p>
          </div>
          <button type="button" (click)="allowIndividual.set(!allowIndividual())"
                  [class]="allowIndividual() ? 'bg-brand' : 'bg-neutral-700'"
                  class="relative w-11 h-6 rounded-full transition-colors flex-shrink-0">
            <span [class]="allowIndividual() ? 'translate-x-5' : 'translate-x-0.5'"
                  class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform"></span>
          </button>
        </label>
      </div>

      <!-- Submit -->
      <button (click)="submit()" [disabled]="!name().trim() || loading()"
              class="w-full flex items-center justify-center gap-2 bg-brand text-neutral-950 font-black
                     py-3.5 rounded-xl hover:bg-brand/90 transition-colors disabled:opacity-50 min-h-[52px]">
        @if (loading()) {
          <span class="w-5 h-5 border-2 border-neutral-700 border-t-neutral-950 rounded-full animate-spin"></span>
        } @else {
          <span class="material-symbols-outlined" style="font-size:20px">emoji_events</span>
          Crear torneo
        }
      </button>

    </div>
  </div>

</div>
