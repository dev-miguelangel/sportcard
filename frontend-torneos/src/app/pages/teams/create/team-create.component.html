<div class="p-6 max-w-lg mx-auto">

  <div class="flex items-center gap-3 mb-6">
    <button (click)="goBack()"
            class="w-9 h-9 flex items-center justify-center rounded-xl bg-neutral-900 border border-neutral-800 hover:bg-neutral-800 transition-colors">
      <span class="material-symbols-outlined text-neutral-400" style="font-size:20px">arrow_back</span>
    </button>
    <h1 class="text-xl font-black">Crear equipo</h1>
  </div>

  <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6">

    @if (error()) {
      <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3 mb-5">
        <span class="material-symbols-outlined text-red-400" style="font-size:18px">error</span>
        <span class="text-sm text-red-400">{{ error() }}</span>
      </div>
    }

    <div class="flex flex-col gap-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">Nombre del equipo *</label>
        <input type="text" [(ngModel)]="name" placeholder="Ej: Los Leones FC"
               class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                      focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">Deporte *</label>
        <select [(ngModel)]="sport"
                class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white
                       focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]">
          @for (s of sports; track s.value) {
            <option [value]="s.value">{{ s.label }}</option>
          }
        </select>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-neutral-400">URL del logo <span class="text-neutral-600">(opcional)</span></label>
        <input type="url" [(ngModel)]="logoUrl" placeholder="https://..."
               class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                      focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
      </div>

      <!-- Categoría de edad -->
      <div class="flex flex-col gap-3">
        <p class="text-xs font-semibold text-neutral-400">Categoría de edad <span class="text-neutral-600">(opcional)</span></p>
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-500">Edad mínima</label>
            <input type="number" [ngModel]="minAge()" (ngModelChange)="minAge.set($event)"
                   placeholder="Sin límite" min="0"
                   class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                          focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs text-neutral-500">Edad máxima</label>
            <input type="number" [ngModel]="maxAge()" (ngModelChange)="maxAge.set($event)"
                   placeholder="Sin límite" min="0"
                   class="bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 text-white placeholder-neutral-600
                          focus:outline-none focus:border-brand transition-colors text-sm min-h-[48px]" />
          </div>
        </div>
      </div>

      <button (click)="submit()" [disabled]="!name().trim() || loading()"
              class="w-full flex items-center justify-center gap-2 bg-brand text-neutral-950 font-black
                     py-3.5 rounded-xl hover:bg-brand/90 transition-colors disabled:opacity-50 min-h-[52px]">
        @if (loading()) {
          <span class="w-5 h-5 border-2 border-neutral-700 border-t-neutral-950 rounded-full animate-spin"></span>
        } @else {
          <span class="material-symbols-outlined" style="font-size:20px">add</span>
          Crear equipo
        }
      </button>

    </div>
  </div>

</div>
